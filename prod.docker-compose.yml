name: model-forge-prod

x-backend-build: &backend-build
  context: ./backend
  dockerfile: prod.Dockerfile

x-backend-environment: &backend-environment
  DB_ENGINE: postgresql
  DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
  DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  DB_HOST: db
  DB_PORT: 5432
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in .env}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Set DJANGO_CSRF_TRUSTED_ORIGINS in .env}
  DJANGO_EMAIL_HOST: ${DJANGO_EMAIL_HOST:-localhost}
  DJANGO_EMAIL_PORT: ${DJANGO_EMAIL_PORT:-25}
  DJANGO_EMAIL_USER: ${DJANGO_EMAIL_USER:-}
  DJANGO_EMAIL_PASSWORD: ${DJANGO_EMAIL_PASSWORD:-}
  DJANGO_EMAIL_USE_TLS: ${DJANGO_EMAIL_USE_TLS:-0}
  ML_TRAINING_TIMEOUT: ${ML_TRAINING_TIMEOUT:-300}
  ML_WORKER_POLL_INTERVAL: ${ML_WORKER_POLL_INTERVAL:-2}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: *backend-build
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    environment: *backend-environment
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: *backend-build
    restart: unless-stopped
    environment: *backend-environment
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c = http.client.HTTPConnection('127.0.0.1', 8000, timeout=3); c.request('GET', '/api/health/'); r = c.getresponse(); r.read(); c.close(); assert r.status == 200"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  ml-worker:
    build: *backend-build
    command: python manage.py run_ml_worker
    restart: unless-stopped
    init: true
    environment: *backend-environment
    volumes:
      - media_data:/app/media
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: prod.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - static_data:/usr/share/nginx/django-static:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  static_data:
