services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-model_forge}
      POSTGRES_USER: ${POSTGRES_USER:-model_forge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-model_forge_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-model_forge} -d ${POSTGRES_DB:-model_forge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: &backend-build
      context: ./backend
      dockerfile: local.Dockerfile
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment: &backend-environment
      DB_ENGINE: postgresql
      DB_NAME: ${POSTGRES_DB:-model_forge}
      DB_USER: ${POSTGRES_USER:-model_forge}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-model_forge_dev_password}
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-key-change-before-deploying}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      ML_TRAINING_TIMEOUT: ${ML_TRAINING_TIMEOUT:-300}
      ML_WORKER_POLL_INTERVAL: ${ML_WORKER_POLL_INTERVAL:-2}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes: &backend-volumes
      - ./backend:/app
      - ./backend/media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c = http.client.HTTPConnection('127.0.0.1', 8000, timeout=3); c.request('GET', '/api/health/'); r = c.getresponse(); r.read(); c.close(); assert r.status == 200"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  ml-worker:
    build: *backend-build
    command: python manage.py run_ml_worker
    environment: *backend-environment
    volumes: *backend-volumes
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  postgres_data:
